<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>StudyMate — পড়ার রুটিন ও টাইমার</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B33A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1E7;
    --paper-2:#ECE9DC;
    --ink:#232323;
    --ink-soft:#5a5650;
    --margin-red:#B33A3A;
    --margin-red-soft:#d98787;
    --rule-blue:#A9C3D9;
    --green:#2F6F4E;
    --green-soft:#e3ede8;
    --amber:#C98A2C;
    --amber-soft:#f5e9d6;
    --white:#FFFDF8;
    --shadow: 0 2px 0 rgba(35,35,35,0.06), 0 8px 20px rgba(35,35,35,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Hind Siliguri', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.tab-label{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* notebook page frame */
  .page{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 38px,
        var(--rule-blue) 38px, var(--rule-blue) 39px
      ),
      var(--paper);
    position:relative;
    padding: 20px 20px 100px 44px;
    border-left: 6px solid var(--margin-red);
  }
  .page::before{
    content:"";
    position:absolute; left:34px; top:0; bottom:0;
    width:1px; background: var(--margin-red-soft);
    opacity:.6;
  }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 0 14px 0;
  }
  .brand{font-size:26px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--margin-red);display:inline-block;}
  .userchip{font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .userchip button{
    background:none;border:none;color:var(--margin-red);font-weight:600;cursor:pointer;
    font-family:inherit; font-size:13px; padding:4px 0;
  }

  /* auth screen */
  #auth-screen{max-width:420px;margin:60px auto 0;padding:0 10px;}
  .auth-card{
    background:var(--white); border-radius:14px; padding:28px 24px;
    box-shadow:var(--shadow); border:1px solid rgba(35,35,35,0.06);
  }
  .auth-card h1{margin:0 0 4px; font-size:28px;}
  .auth-card p.sub{margin:0 0 20px; color:var(--ink-soft); font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input{
    width:100%; padding:11px 12px; border-radius:9px;
    border:1.5px solid #ddd8c8; font-size:15px; font-family:inherit;
    background:var(--paper); color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--rule-blue); outline-offset:1px; border-color:var(--rule-blue);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 18px; border-radius:9px; border:none; cursor:pointer;
    font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:15px;
    transition: transform .08s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--margin-red); color:white; width:100%;}
  .btn-primary:hover{background:#9c3131;}
  .btn-ghost{background:transparent; color:var(--ink-soft); text-decoration:underline; font-size:13px; padding:8px 0;}
  .auth-toggle{text-align:center; margin-top:14px;}
  .auth-error{color:var(--margin-red); font-size:13px; margin-top:8px; min-height:16px;}

  /* tabs */
  nav.tabs{
    display:flex; gap:6px; margin: 6px 0 20px;
    border-bottom:1px solid #ddd8c8;
  }
  nav.tabs button{
    background:none; border:none; cursor:pointer; padding:8px 4px 12px;
    font-family:'Baloo Da 2',sans-serif; font-weight:600; font-size:15px;
    color:var(--ink-soft); position:relative; margin-right:14px;
  }
  nav.tabs button.active{color:var(--ink);}
  nav.tabs button.active::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:3px;
    background:var(--margin-red); border-radius:3px;
  }

  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--white); border-radius:14px; padding:20px;
    box-shadow:var(--shadow); border:1px solid rgba(35,35,35,0.06);
    margin-bottom:16px;
  }
  .card h2{margin:0 0 14px; font-size:18px;}

  /* timer */
  .timer-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px;}
  .ring-holder{position:relative; width:220px; height:220px;}
  .ring-holder svg{transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:#eae6d8; stroke-width:10;}
  .ring-fg{fill:none; stroke:var(--margin-red); stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset .3s linear, stroke .3s ease;}
  .ring-fg.break-mode{stroke:var(--green);}
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-time{font-size:40px; font-weight:700; letter-spacing:1px;}
  .ring-mode{font-size:13px; color:var(--ink-soft); margin-top:4px; font-weight:600;}
  .subject-pick{margin:16px 0 6px; width:100%;}
  .subject-pick select{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid #ddd8c8;
    font-family:inherit; font-size:14px; background:var(--white);
  }
  .timer-controls{display:flex; gap:10px; margin-top:16px; width:100%;}
  .timer-controls .btn{flex:1;}
  .btn-secondary{background:var(--paper-2); color:var(--ink);}
  .btn-secondary:hover{background:#e2ddc9;}

  /* tally */
  .tally-row{display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .tally-label{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .tally-marks{display:flex; gap:6px; flex-wrap:wrap;}
  .tally-group{display:flex; align-items:flex-end; position:relative; width:26px; height:22px;}
  .tally-group svg line{stroke:var(--margin-red); stroke-width:2.4; stroke-linecap:round;}

  /* routine list */
  .routine-item{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px dashed #ddd8c8;
  }
  .routine-item:last-child{border-bottom:none;}
  .routine-time{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    background:var(--paper-2); padding:6px 9px; border-radius:7px; min-width:64px; text-align:center;
  }
  .routine-info{flex:1;}
  .routine-subject{font-weight:700; font-size:15px;}
  .routine-days{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .routine-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:18px; padding:4px 6px;}
  .routine-del:hover{color:var(--margin-red);}
  .empty-note{color:var(--ink-soft); font-size:14px; padding:10px 0;}

  .form-row{display:flex; gap:10px;}
  .form-row .field{flex:1;}
  .day-picker{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .day-chip{
    padding:6px 10px; border-radius:20px; border:1.5px solid #ddd8c8;
    font-size:12px; cursor:pointer; background:var(--white); user-select:none;
    font-weight:600; color:var(--ink-soft);
  }
  .day-chip.on{background:var(--margin-red); border-color:var(--margin-red); color:white;}

  /* stats */
  .stat-total{display:flex; align-items:baseline; gap:10px; margin-bottom:16px;}
  .stat-total .num{font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700;}
  .stat-total .unit{color:var(--ink-soft); font-size:14px;}
  .bar-row{margin-bottom:12px;}
  .bar-row .bar-label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .bar-track{height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--green); border-radius:6px;}

  .notif-banner{
    background:var(--amber-soft); border:1px solid var(--amber);
    border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .notif-banner button{
    background:var(--amber); border:none; color:white; padding:7px 12px;
    border-radius:7px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--white); padding:10px 18px; border-radius:9px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:50; max-width:80%; text-align:center;
  }
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .ring-fg, .btn{transition:none;}
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h1>StudyMate</h1>
    <p class="sub">তোমার পড়াশোনার রুটিন, টাইমার আর হিসাব — এক জায়গায়।</p>
    <div id="login-form">
      <div class="field"><label>ইমেইল</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="doLogin()">লগইন করো</button>
      <div class="auth-error" id="login-error"></div>
      <div class="auth-toggle"><button class="btn-ghost" onclick="toggleAuth('signup')">নতুন অ্যাকাউন্ট বানাও</button></div>
    </div>
    <div id="signup-form" style="display:none;">
      <div class="field"><label>নাম</label><input type="text" id="signup-name" placeholder="তোমার নাম"></div>
      <div class="field"><label>ইমেইল</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="field"><label>পাসওয়ার্ড (কমপক্ষে ৬ ডিজিট)</label><input type="password" id="signup-pass" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="doSignup()">অ্যাকাউন্ট বানাও</button>
      <div class="auth-error" id="signup-error"></div>
      <div class="auth-toggle"><button class="btn-ghost" onclick="toggleAuth('login')">আগের অ্যাকাউন্টে লগইন করো</button></div>
    </div>
  </div>
</div>

<div class="page" id="app-page" style="display:none;">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>StudyMate</div>
    <div class="userchip"><span id="user-name-label"></span><button onclick="doLogout()">লগআউট</button></div>
  </header>

  <div id="notif-banner-holder"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-view="timer">টাইমার</button>
    <button class="tab-btn" data-view="routine">রুটিন</button>
    <button class="tab-btn" data-view="stats">পরিসংখ্যান</button>
  </nav>

  <section class="view active" id="view-timer">
    <div class="card">
      <div class="timer-wrap">
        <div class="subject-pick">
          <select id="timer-subject"></select>
        </div>
        <div class="ring-holder">
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="98"></circle>
            <circle class="ring-fg" id="ring-fg" cx="110" cy="110" r="98"
              stroke-dasharray="615.75" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-time mono" id="ring-time">25:00</div>
            <div class="ring-mode" id="ring-mode">ফোকাস</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="btn btn-secondary" id="btn-reset" onclick="resetTimer()">রিসেট</button>
          <button class="btn btn-primary" id="btn-startpause" onclick="toggleTimer()">শুরু করো</button>
        </div>
        <div class="tally-row">
          <span class="tally-label">আজকের ফোকাস সেশন:</span>
          <div class="tally-marks" id="tally-marks"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-routine">
    <div class="card">
      <h2>নতুন রুটিন যোগ করো</h2>
      <div class="field"><label>বিষয় (Subject)</label><input type="text" id="rt-subject" placeholder="যেমনঃ পদার্থবিজ্ঞান"></div>
      <div class="form-row">
        <div class="field">
          <label>ঘণ্টা</label>
          <select id="rt-hour"></select>
        </div>
        <div class="field">
          <label>মিনিট</label>
          <select id="rt-min">
            <option value="00">00</option><option value="15">15</option>
            <option value="30">30</option><option value="45">45</option>
          </select>
        </div>
        <div class="field">
          <label>AM/PM</label>
          <select id="rt-ampm"><option value="AM">AM</option><option value="PM">PM</option></select>
        </div>
      </div>
      <label style="font-size:13px;color:var(--ink-soft);font-weight:600;">কোন কোন দিন</label>
      <div class="day-picker" id="day-picker"></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="addRoutine()">রুটিনে যোগ করো</button>
    </div>
    <div class="card">
      <h2>তোমার রুটিন</h2>
      <div id="routine-list"><div class="empty-note">এখনো কোনো রুটিন যোগ করা হয়নি।</div></div>
    </div>
  </section>

  <section class="view" id="view-stats">
    <div class="card">
      <h2>আজকের পড়াশোনা</h2>
      <div class="stat-total">
        <span class="num mono" id="stat-total-min">0</span>
        <span class="unit">মিনিট মোট</span>
      </div>
      <div id="stat-bars"><div class="empty-note">আজ এখনো কোনো ফোকাস সেশন শেষ হয়নি।</div></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, addDoc, collection, deleteDoc,
  query, where, onSnapshot, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbnONzsvSa4nb8_K47cs10N0Gv5MK1DZc",
  authDomain: "studymate-72f7b.firebaseapp.com",
  projectId: "studymate-72f7b",
  storageBucket: "studymate-72f7b.firebasestorage.app",
  messagingSenderId: "494648741720",
  appId: "1:494648741720:web:bff97c32645e13894f9f2d",
  measurementId: "G-3D2G9YW55Y"
};

// !!! IMPORTANT: paste your VAPID key here.
// Get it from: Firebase Console > Project Settings > Cloud Messaging > Web configuration > Generate key pair
const VAPID_KEY = "BOKPwIfI3e51-3ezxApui8W8eOjglQZUJK5IpoVAdQhJacJJe0QCmcHp_nXUkDz1gGs0qniHmHgTHmD4FKpnG3s";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let subjectsCache = [];
let routineUnsub = null, sessionsUnsub = null;

/* ---------- AUTH ---------- */
window.toggleAuth = function(which){
  document.getElementById('login-form').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = which === 'signup' ? 'block' : 'none';
};

window.doSignup = async function(){
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass = document.getElementById('signup-pass').value;
  const errEl = document.getElementById('signup-error');
  errEl.textContent = '';
  if(!name || !email || pass.length < 6){
    errEl.textContent = 'নাম, ইমেইল ঠিকভাবে দাও এবং পাসওয়ার্ড কমপক্ষে ৬ ডিজিট হতে হবে।';
    return;
  }
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, createdAt: serverTimestamp() });
  }catch(e){
    errEl.textContent = friendlyAuthError(e);
  }
};

window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errEl.textContent = friendlyAuthError(e);
  }
};

window.doLogout = async function(){
  stopTimer(true);
  await signOut(auth);
};

function friendlyAuthError(e){
  const code = e.code || '';
  if(code.includes('email-already-in-use')) return 'এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে।';
  if(code.includes('invalid-email')) return 'ইমেইলটা ঠিক না, আবার চেক করো।';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'ইমেইল বা পাসওয়ার্ড ভুল।';
  if(code.includes('user-not-found')) return 'এই ইমেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি।';
  if(code.includes('weak-password')) return 'পাসওয়ার্ড আরেকটু শক্তিশালী করো (কমপক্ষে ৬ ডিজিট)।';
  return 'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করো।';
}

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if(user){
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-page').style.display = 'block';
    document.getElementById('user-name-label').textContent = user.displayName || user.email;
    startListeners(user.uid);
    setupNotifications();
  } else {
    document.getElementById('auth-screen').style.display = 'block';
    document.getElementById('app-page').style.display = 'none';
    if(routineUnsub) routineUnsub();
    if(sessionsUnsub) sessionsUnsub();
  }
});

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});

/* ---------- ROUTINE FORM SETUP ---------- */
const hourSel = document.getElementById('rt-hour');
for(let h=1; h<=12; h++){
  const opt = document.createElement('option');
  opt.value = String(h).padStart(2,'0');
  opt.textContent = String(h).padStart(2,'0');
  hourSel.appendChild(opt);
}
const DAYS = [
  {k:'sat', l:'শনি'}, {k:'sun', l:'রবি'}, {k:'mon', l:'সোম'},
  {k:'tue', l:'মঙ্গল'}, {k:'wed', l:'বুধ'}, {k:'thu', l:'বৃহঃ'}, {k:'fri', l:'শুক্র'}
];
const dayPicker = document.getElementById('day-picker');
const selectedDays = new Set();
DAYS.forEach(d=>{
  const chip = document.createElement('div');
  chip.className = 'day-chip';
  chip.textContent = d.l;
  chip.dataset.key = d.k;
  chip.onclick = ()=>{
    chip.classList.toggle('on');
    if(selectedDays.has(d.k)) selectedDays.delete(d.k); else selectedDays.add(d.k);
  };
  dayPicker.appendChild(chip);
});

window.addRoutine = async function(){
  const subject = document.getElementById('rt-subject').value.trim();
  const hour = document.getElementById('rt-hour').value;
  const min = document.getElementById('rt-min').value;
  const ampm = document.getElementById('rt-ampm').value;
  if(!subject){ showToast('বিষয়ের নাম দাও।'); return; }
  if(selectedDays.size === 0){ showToast('কমপক্ষে একটা দিন বেছে নাও।'); return; }
  await addDoc(collection(db, 'users', currentUser.uid, 'routine'), {
    subject, hour, min, ampm, days: Array.from(selectedDays), createdAt: serverTimestamp()
  });
  document.getElementById('rt-subject').value = '';
  selectedDays.clear();
  document.querySelectorAll('.day-chip').forEach(c=>c.classList.remove('on'));
  showToast('রুটিনে যোগ হয়েছে।');
};

window.deleteRoutine = async function(id){
  await deleteDoc(doc(db, 'users', currentUser.uid, 'routine', id));
};

/* ---------- LISTENERS: routine + subjects + sessions ---------- */
function startListeners(uid){
  const routineQ = collection(db, 'users', uid, 'routine');
  routineUnsub = onSnapshot(routineQ, (snap)=>{
    const items = [];
    snap.forEach(d=> items.push({ id: d.id, ...d.data() }));
    renderRoutineList(items);
    subjectsCache = Array.from(new Set(items.map(i=>i.subject)));
    if(subjectsCache.length === 0) subjectsCache = ['সাধারণ পড়াশোনা'];
    renderSubjectSelect();
  });

  const todayStr = dateStr(new Date());
  const sessQ = query(collection(db, 'users', uid, 'sessions'), where('dateStr', '==', todayStr));
  sessionsUnsub = onSnapshot(sessQ, (snap)=>{
    const sessions = [];
    snap.forEach(d=> sessions.push(d.data()));
    renderStats(sessions);
    renderTally(sessions);
  });
}

function renderRoutineList(items){
  const holder = document.getElementById('routine-list');
  if(items.length === 0){
    holder.innerHTML = '<div class="empty-note">এখনো কোনো রুটিন যোগ করা হয়নি।</div>';
    return;
  }
  items.sort((a,b)=> (a.ampm+a.hour+a.min).localeCompare(b.ampm+b.hour+b.min));
  holder.innerHTML = '';
  items.forEach(it=>{
    const row = document.createElement('div');
    row.className = 'routine-item';
    const dayLabels = it.days.map(k => DAYS.find(d=>d.k===k)?.l || k).join(', ');
    row.innerHTML = `
      <div class="routine-time">${it.hour}:${it.min} ${it.ampm}</div>
      <div class="routine-info">
        <div class="routine-subject">${escapeHtml(it.subject)}</div>
        <div class="routine-days">${escapeHtml(dayLabels)}</div>
      </div>
      <button class="routine-del" onclick="deleteRoutine('${it.id}')">✕</button>
    `;
    holder.appendChild(row);
  });
}

function renderSubjectSelect(){
  const sel = document.getElementById('timer-subject');
  const prev = sel.value;
  sel.innerHTML = '';
  subjectsCache.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  if(subjectsCache.includes(prev)) sel.value = prev;
}

function renderStats(sessions){
  const totalMin = sessions.reduce((sum,s)=> sum + (s.durationMin||0), 0);
  document.getElementById('stat-total-min').textContent = totalMin;
  const bySubject = {};
  sessions.forEach(s=>{
    bySubject[s.subject] = (bySubject[s.subject]||0) + (s.durationMin||0);
  });
  const holder = document.getElementById('stat-bars');
  const entries = Object.entries(bySubject).sort((a,b)=> b[1]-a[1]);
  if(entries.length === 0){
    holder.innerHTML = '<div class="empty-note">আজ এখনো কোনো ফোকাস সেশন শেষ হয়নি।</div>';
    return;
  }
  const max = entries[0][1];
  holder.innerHTML = '';
  entries.forEach(([subj, min])=>{
    const row = document.createElement('div');
    row.className = 'bar-row';
    const pct = Math.max(6, Math.round((min/max)*100));
    row.innerHTML = `
      <div class="bar-label"><span>${escapeHtml(subj)}</span><span class="mono">${min} মিনিট</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;
    holder.appendChild(row);
  });
}

function renderTally(sessions){
  const count = sessions.filter(s=> s.type === 'focus').length;
  const holder = document.getElementById('tally-marks');
  holder.innerHTML = '';
  let remaining = count;
  while(remaining > 0){
    const groupCount = Math.min(remaining, 5);
    holder.appendChild(makeTallyGroup(groupCount));
    remaining -= groupCount;
  }
  if(count === 0){
    holder.innerHTML = '<span style="font-size:13px;color:var(--ink-soft);">এখনো নেই</span>';
  }
}

function makeTallyGroup(n){
  const wrap = document.createElement('div');
  wrap.className = 'tally-group';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','26'); svg.setAttribute('height','22');
  const positions = [4,9,14,19];
  for(let i=0;i<Math.min(n,4);i++){
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', positions[i]); line.setAttribute('y1', 2);
    line.setAttribute('x2', positions[i]); line.setAttribute('y2', 20);
    svg.appendChild(line);
  }
  if(n === 5){
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', 1); line.setAttribute('y1', 20);
    line.setAttribute('x2', 22); line.setAttribute('y2', 2);
    svg.appendChild(line);
  }
  wrap.appendChild(svg);
  return wrap;
}

/* ---------- POMODORO TIMER ---------- */
const FOCUS_SEC = 25*60;
const BREAK_SEC = 5*60;
const RING_CIRC = 2 * Math.PI * 98;

let mode = 'focus'; // 'focus' | 'break'
let remaining = FOCUS_SEC;
let running = false;
let tickHandle = null;

const ringFg = document.getElementById('ring-fg');
const ringTime = document.getElementById('ring-time');
const ringMode = document.getElementById('ring-mode');
const startPauseBtn = document.getElementById('btn-startpause');

function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function paintRing(){
  const total = mode === 'focus' ? FOCUS_SEC : BREAK_SEC;
  const frac = remaining / total;
  ringFg.setAttribute('stroke-dasharray', RING_CIRC.toFixed(2));
  ringFg.setAttribute('stroke-dashoffset', (RING_CIRC * (1-frac)).toFixed(2));
  ringFg.classList.toggle('break-mode', mode === 'break');
  ringTime.textContent = fmt(remaining);
  ringMode.textContent = mode === 'focus' ? 'ফোকাস' : 'বিরতি';
}

window.toggleTimer = function(){
  if(running){ pauseTimer(); } else { startTimer(); }
};

function startTimer(){
  running = true;
  startPauseBtn.textContent = 'থামাও';
  tickHandle = setInterval(()=>{
    remaining -= 1;
    if(remaining <= 0){
      completeSegment();
      return;
    }
    paintRing();
  }, 1000);
}

function pauseTimer(){
  running = false;
  startPauseBtn.textContent = 'শুরু করো';
  clearInterval(tickHandle);
}

function stopTimer(){
  running = false;
  clearInterval(tickHandle);
}

window.resetTimer = function(){
  stopTimer();
  mode = 'focus';
  remaining = FOCUS_SEC;
  startPauseBtn.textContent = 'শুরু করো';
  paintRing();
};

async function completeSegment(){
  stopTimer();
  const finishedMode = mode;
  const subject = document.getElementById('timer-subject').value || 'সাধারণ পড়াশোনা';

  if(finishedMode === 'focus' && currentUser){
    await addDoc(collection(db, 'users', currentUser.uid, 'sessions'), {
      subject, type: 'focus', durationMin: Math.round(FOCUS_SEC/60),
      dateStr: dateStr(new Date()), completedAt: serverTimestamp()
    });
  }

  notifyLocal(finishedMode === 'focus' ? 'ফোকাস সেশন শেষ! এখন একটু বিরতি নাও।' : 'বিরতি শেষ! আবার ফোকাসে ফিরে আসো।');

  mode = finishedMode === 'focus' ? 'break' : 'focus';
  remaining = mode === 'focus' ? FOCUS_SEC : BREAK_SEC;
  paintRing();
}

paintRing();

/* ---------- helpers ---------- */
function dateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
let toastTimeout = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------- NOTIFICATIONS (FCM) ---------- */
async function setupNotifications(){
  const banner = document.getElementById('notif-banner-holder');
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    return;
  }
  if(Notification.permission === 'granted'){
    banner.innerHTML = '';
    registerForPush();
    return;
  }
  if(Notification.permission === 'denied'){
    banner.innerHTML = `<div class="notif-banner"><span>নোটিফিকেশন বন্ধ আছে — রুটিন অনুযায়ী রিমাইন্ডার পেতে হলে browser settings থেকে চালু করো।</span></div>`;
    return;
  }
  banner.innerHTML = `
    <div class="notif-banner">
      <span>রুটিন অনুযায়ী রিমাইন্ডার পেতে নোটিফিকেশন চালু করো।</span>
      <button id="notif-enable-btn">চালু করো</button>
    </div>`;
  document.getElementById('notif-enable-btn').onclick = async ()=>{
    const perm = await Notification.requestPermission();
    if(perm === 'granted'){
      banner.innerHTML = '';
      registerForPush();
      showToast('নোটিফিকেশন চালু হয়েছে।');
    }
  };
}

async function registerForPush(){
  try{
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(token && currentUser){
      await setDoc(doc(db, 'users', currentUser.uid, 'fcmTokens', token), {
        createdAt: serverTimestamp(), ua: navigator.userAgent
      });
    }
    onMessage(messaging, (payload)=>{
      const title = payload.notification?.title || 'StudyMate';
      const body = payload.notification?.body || '';
      notifyLocal(body, title);
    });
  }catch(e){
    console.warn('Push setup failed (check VAPID key):', e);
  }
}

function notifyLocal(body, title){
  title = title || 'StudyMate';
  showToast(body);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, { body, icon: 'icon.png' }); }catch(e){}
  }
}
